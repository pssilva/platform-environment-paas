name: platform-environment-paas

services:
  postgresql:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  gitlab:
    image: gitlab/gitlab-ce:19.4.1-ce.0
    hostname: ${GITLAB_HOSTNAME:-gitlab.local}
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:${GITLAB_HTTP_PORT:-8929}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2224}
    ports:
      - "127.0.0.1:${GITLAB_HTTP_PORT:-8929}:8929"
      - "127.0.0.1:${GITLAB_SSH_PORT:-2224}:22"
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    shm_size: 256m
    restart: unless-stopped

  jenkins:
    image: jenkins/jenkins:2.568.3-jdk21
    ports:
      - "127.0.0.1:${JENKINS_HTTP_PORT:-8080}:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
    restart: unless-stopped

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    ports:
      - "127.0.0.1:${SONARQUBE_PORT:-9000}:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.125.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./kubernetes/base/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    restart: unless-stopped

volumes:
  postgresql-data:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  jenkins-home:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  grafana-data:
