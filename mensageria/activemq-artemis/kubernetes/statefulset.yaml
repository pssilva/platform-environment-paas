apiVersion: v1
kind: Service
metadata:
  name: artemis
spec:
  clusterIP: None
  selector:
    app: artemis
  ports:
    - name: core
      port: 61616
      targetPort: core
    - name: console
      port: 8161
      targetPort: console
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: mqtt
      port: 1883
      targetPort: mqtt
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: artemis
spec:
  serviceName: artemis
  replicas: 1
  selector:
    matchLabels:
      app: artemis
  template:
    metadata:
      labels:
        app: artemis
    spec:
      containers:
        - name: artemis
          image: apache/activemq-artemis:2.53.0-alpine
          ports:
            - name: core
              containerPort: 61616
            - name: console
              containerPort: 8161
            - name: amqp
              containerPort: 5672
            - name: mqtt
              containerPort: 1883
          env:
            - name: ARTEMIS_USER
              valueFrom:
                secretKeyRef:
                  name: artemis-credentials
                  key: username
            - name: ARTEMIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: artemis-credentials
                  key: password
            - name: ANONYMOUS_LOGIN
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /var/lib/artemis-instance
          startupProbe:
            tcpSocket:
              port: core
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: core
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: core
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
