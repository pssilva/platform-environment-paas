services:
  oneagent:
    image: ${ONEAGENT_IMAGE:?Set ONEAGENT_IMAGE to a supported Dynatrace OneAgent image tag}
    container_name: dynatrace-oneagent
    restart: on-failure:5
    read_only: true
    pid: host
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - FOWNER
      - FSETID
      - KILL
      - NET_ADMIN
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETUID
      - SYS_ADMIN
      - SYS_CHROOT
      - SYS_PTRACE
      - SYS_RESOURCE
    security_opt:
      - apparmor:unconfined
    environment:
      ONEAGENT_ENABLE_VOLUME_STORAGE: "true"
      ONEAGENT_INSTALLER_SCRIPT_URL: ${ONEAGENT_INSTALLER_SCRIPT_URL:?Set the installer URL from Dynatrace Hub}
      ONEAGENT_INSTALLER_DOWNLOAD_TOKEN: ${ONEAGENT_INSTALLER_DOWNLOAD_TOKEN:?Provide a protected PaaS token}
    volumes:
      - /:/mnt/root
      - oneagent-storage:/mnt/volume_storage_mount

volumes:
  oneagent-storage:
