apiVersion: v1
kind: Service
metadata:
  name: sql-server
spec:
  clusterIP: None
  selector:
    app: sql-server
  ports:
    - name: tds
      port: 1433
      targetPort: tds
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sql-server
spec:
  serviceName: sql-server
  replicas: 1
  selector:
    matchLabels:
      app: sql-server
  template:
    metadata:
      labels:
        app: sql-server
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: sql-server
          image: mcr.microsoft.com/mssql/server:2022-GA-ubuntu
          ports:
            - name: tds
              containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: Developer
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sql-server-credentials
                  key: sa-password
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
          startupProbe:
            tcpSocket:
              port: tds
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: tds
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: tds
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
