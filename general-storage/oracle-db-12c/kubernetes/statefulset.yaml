apiVersion: v1
kind: Service
metadata:
  name: oracle-db
spec:
  clusterIP: None
  selector:
    app: oracle-db
  ports:
    - name: listener
      port: 1521
      targetPort: listener
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oracle-db
spec:
  serviceName: oracle-db
  replicas: 1
  selector:
    matchLabels:
      app: oracle-db
  template:
    metadata:
      labels:
        app: oracle-db
    spec:
      containers:
        - name: oracle-db
          image: oracle/database:12.2.0.1-se2
          imagePullPolicy: IfNotPresent
          ports:
            - name: listener
              containerPort: 1521
          env:
            - name: ORACLE_PWD
              valueFrom:
                secretKeyRef:
                  name: oracle-db-credentials
                  key: password
          volumeMounts:
            - name: data
              mountPath: /opt/oracle/oradata
          startupProbe:
            tcpSocket:
              port: listener
            periodSeconds: 20
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: listener
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: listener
            initialDelaySeconds: 180
            periodSeconds: 30
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
