services:
  cassandra:
    image: cassandra:5.0.9
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME:-general-storage-lab}
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    ports:
      - "127.0.0.1:${CASSANDRA_PORT:-9042}:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "127.0.0.1", "9042", "-e", "SELECT release_version FROM system.local"]
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 120s
    restart: unless-stopped

volumes:
  cassandra-data:
